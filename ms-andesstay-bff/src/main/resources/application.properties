server.port=8080
spring.application.name=ms-andesstay-bff

# CONFIGURACIÓN DE SEGURIDAD (RESOURCE SERVER - JWT MICROSOFT ENTRA ID)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/15dd23f3-92e9-4574-8b7c-2cf6104370cd/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=9a8c1f22-da48-441c-8ba8-7f0fe7fadf57,api://9a8c1f22-da48-441c-8ba8-7f0fe7fadf57

# ENRUTAMIENTO HACIA LOS MICROSERVICIOS (SPRING CLOUD GATEWAY SERVER WEBMVC)
# 1. Ruta para Catálogo
spring.cloud.gateway.server.webmvc.routes[0].id=catalog-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${CATALOG_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/catalog/**

# 2. Ruta para Reservas
spring.cloud.gateway.server.webmvc.routes[1].id=reservations-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${RESERVATIONS_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/reservations/**

# 3. Ruta para Administración de RabbitMQ / Notificaciones
spring.cloud.gateway.server.webmvc.routes[2].id=notify-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${NOTIFY_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/rabbitmq/**
